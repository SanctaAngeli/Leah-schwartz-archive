[build]
  command = "npm run build"
  publish = "dist"

# Netlify builds from GitHub on every push to main; pin Node to what we develop on.
[build.environment]
  NODE_VERSION = "24"

# Single-page app: every route is served by index.html and resolved
# client-side by React Router (deep links like /her-words/immigrants).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
